version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "npm"
    directory: "/packages/eslint-config-airbnb"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "npm"
    directory: "/packages/eslint-config-airbnb-base"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
